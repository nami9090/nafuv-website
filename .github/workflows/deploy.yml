# =============================================================================
# NAFUV: tests, then validation for deployment.
#
#   git push on "main" -> tests -> (if they pass) the commit is copied to the
#   "production" branch -> the cPanel server sees it within 5 minutes and
#   updates itself (deploy/verifier.sh, launched by a cron job).
#
# The hosting does not accept SSH connections from GitHub: it is the server
# that fetches the validated version, GitHub never connects to it.
# =============================================================================
name: Tests and deployment

on:
  push:
    branches: [main]
  workflow_dispatch:   # "Run workflow" button

concurrency:
  group: deploiement-nafuv
  cancel-in-progress: false

permissions:
  contents: write      # needed to update the "production" branch

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: tests-only
      DEBUG: "False"
      DB_ENGINE: sqlite
      SECURE_SSL_REDIRECT: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run the tests
        run: python manage.py test mainApp tableau

  valider:
    name: Validate for production
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy the tested version to the "production" branch
        run: |
          git push --force origin "HEAD:refs/heads/production"
          echo "Version $(git rev-parse --short HEAD) validated: the server will install it within 5 minutes."
