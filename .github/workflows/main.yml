name: CI -> Deploy Django Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug project structure
        run: |
          pwd
          ls -la

      - name: Deploy Django project via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: sftp
          port: 22

          local-dir: ./
          server-dir: /public_html/nafuv-website/

          timeout: 600000
          log-level: verbose
          dangerous-clean-slate: false

          exclude: |
            **/.git*
            **/.github/**
            **/__pycache__/**
            **/*.pyc
            **/venv/**
            **/env/**
            **/.env
            **/node_modules/**
