name: CI -> Deploy Django Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Debug (important pour éviter les erreurs de chemin)
      - name: Debug project structure
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la

      # 3️⃣ Déploiement FTP (stable)
      - name: Deploy Django project via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # 📂 IMPORTANT
          local-dir: ./
          remote-dir: /public_html/nafuv-website/

          # 🔐 Connexion FTP sécurisée (évite les timeouts)
          protocol: ftp
          port: 21
          security: loose

          # ⏱️ Anti-timeout
          timeout: 600000
          log-level: verbose
          dangerous-clean-slate: false

          # 🚫 Fichiers à exclure
          exclude: |
            **/.git*
            **/.github/**
            **/__pycache__/**
            **/*.pyc
            **/venv/**
            **/env/**
            **/.env
            **/node_modules/**
